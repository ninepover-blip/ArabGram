version: 1

instance:
  id: core-mainnet-a

debug:
  addr: 127.0.0.1:6061

public:
  dc: 2
  default_country_code: CN
  advertise:
    ip: ${TELESRV_PUBLIC_IP}
    port: 2398
  base_url: https://${TELESRV_PUBLIC_HOST}
  app_scheme: telesrv
  web_base_url: https://${TELESRV_WEB_HOST}

branding:
  product_name: Telesrv
  product_username: telesrv
  desktop_app_name: Telesrv Desktop
  android_app_name: Telesrv Android
  ios_app_name: Telesrv iOS
  macos_app_name: Telesrv macOS
  web_a_app_name: Telesrv Web A
  web_k_app_name: Telesrv Web K
  premium_name: Telesrv Premium
  stars_name: Telesrv Stars

postgres:
  dsn: ${TELESRV_POSTGRES_DSN}

redis:
  addr: ${TELESRV_REDIS_ADDR}
  password: ${TELESRV_REDIS_PASSWORD}
  db: 0

core_exec:
  addr: 127.0.0.1:2440
  token: ${TELESRV_CORE_EXEC_TOKEN}

file_data:
  resolver: static
  targets:
    - 127.0.0.1:2520
  token: ${TELESRV_FILE_TOKEN}
  timeout: 10s

group_call:
  control_addr: 127.0.0.1:2420
  control_token: ${TELESRV_GROUPCALL_CONTROL_TOKEN}

sfu:
  control:
    token: ${TELESRV_SFU_CONTROL_TOKEN}
    timeout: 5s
  owner:
    ttl: 2m
    heartbeat_interval: 30s
    health_timeout: 1s

turn:
  enabled: false

livestream:
  enabled: false

translation:
  enabled: false

http:
  bot_api_addr: ""
  admin_api_addr: ""
  public_link_web_addr: 127.0.0.1:2401

outbox:
  lease_timeout: 30s
  outbound_push_timeout: 200ms

media:
  external_media_enable: true
  web_page_preview_enable: true

star_gifts:
  export:
    mode: ton
    ton:
      network: mainnet
      collection_address: ${TELESRV_TON_COLLECTION_ADDRESS}
      collection_code_hash: ${TELESRV_TON_COLLECTION_CODE_HASH}
      mint_abi: basic-collection-v1
      initial_item_index: "${TELESRV_TON_INITIAL_ITEM_INDEX}"
      proof_domain: ${TELESRV_PUBLIC_HOST}
      capability_secret_file: ${TELESRV_TON_CAPABILITY_SECRET_FILE}
      # Replace with one verified canary account before the first mainnet mint.
      allow_user_ids:
        - 123456789
      ttl: 30m
      challenge_ttl: 5m
      finalizer:
        batch: 20
        poll_interval: 2s
        lease_timeout: 30s
        request_timeout: 10s
        retry_delay: 5s
      claim:
        enabled: true
        bot_token_file: ${TELESRV_TON_CLAIM_BOT_TOKEN_FILE}
        init_data_ttl: 15m
